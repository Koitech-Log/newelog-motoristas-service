# Perfil usado pelos testes automatizados (ver @ActiveProfiles("test") nas
# classes de teste). Usa H2 em memória para o CI não depender de um Postgres
# real disponível no runner do GitHub Actions.
#
# IMPORTANTE: só a migration V1 (schema) é aplicada aqui — a V2 (seed) usa
# SELECT setval(), função específica do PostgreSQL que o H2 não emula. Os
# testes de integração populam seus próprios dados via @Sql ou diretamente
# pelo repository, isolados por teste.
spring.datasource.url=jdbc:h2:mem:motoristas_test;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.target=1
