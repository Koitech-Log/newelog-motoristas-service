spring.application.name=motoristas-service

# Configuração padrão: desenvolvimento local, banco Postgres em localhost
# (subido via "docker compose up -d motoristas-db" neste mesmo repositório).
# Em ambiente containerizado, ative o perfil "docker" via
# SPRING_PROFILES_ACTIVE=docker — ver application-docker.properties.
spring.datasource.url=jdbc:postgresql://localhost:5432/motoristas_db
spring.datasource.username=newelog
spring.datasource.password=newelog

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=8080

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
