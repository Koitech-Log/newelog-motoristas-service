services:
  motoristas-db:
    image: postgres:16
    environment:
      POSTGRES_DB: motoristas_db
      POSTGRES_USER: ${DB_USERNAME:-newelog}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-newelog}
    ports:
      - "5432:5432"
    volumes:
      - motoristas-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-newelog} -d motoristas_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  motoristas-service:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://motoristas-db:5432/motoristas_db
      DB_USERNAME: ${DB_USERNAME:-newelog}
      DB_PASSWORD: ${DB_PASSWORD:-newelog}
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      motoristas-db:
        condition: service_healthy

volumes:
  motoristas-db-data: